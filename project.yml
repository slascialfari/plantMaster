name: plantMaster
options:
  bundleIdPrefix: com.stefanolascialfari
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  plantMaster:
    type: application
    platform: iOS
    sources:
      - path: plantMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stefanolascialfari.plantMaster
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: F4596X5WBZ
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: plantMaster/Info.plist
      properties:
        CFBundleDisplayName: Herbarius
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: "Herbarius uses the camera to take reference photos of plants you're studying."
  plantMasterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: plantMasterTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: plantMaster
schemes:
  plantMaster:
    build:
      targets:
        plantMaster: all
    test:
      targets:
        - plantMasterTests
    run:
      config: Debug
    archive:
      config: Release
